name: "Go Version and Release"
description: >
  Determines a Go project release version, validates semver progression, creates
  and pushes a git tag, then runs GoReleaser and can publish generated .deb artifacts to apt.
author: "MiguelRodo"

branding:
  icon: "tag"
  color: "blue"

inputs:
  github_token:
    description: "GitHub token for pushing tags and publishing releases."
    required: true
  apt_repo_token:
    description: "Optional GitHub token used only for cloning/fetching/pushing apt_repo. Falls back to github_token when omitted."
    required: false
    default: ""
  apt_signing_key:
    description: "Optional ASCII-armored GPG private key for signing apt repository metadata. When set, the action imports the key and generates signed InRelease and Release.gpg files alongside the unsigned Release file."
    required: false
    default: ""
  apt_signing_key_passphrase:
    description: "Optional passphrase for the apt_signing_key. When set, it is written to a secure temporary file and passed to GPG via --passphrase-file so passphrase-protected private keys can be used for signing."
    required: false
    default: ""
  version:
    description: "Exact version to apply (e.g. 1.2.3). Cannot be used with bump_type."
    required: false
    default: ""
  bump_type:
    description: "Version component to bump (major | minor | patch). Cannot be used with version."
    required: false
    default: ""
  version_force:
    description: >
      When true (the default is false), skip strict version progression
      checks (e.g., allowing downgrades or large version jumps).
    required: false
    default: "false"
  go_version:
    description: "Go version to install with actions/setup-go."
    required: false
    default: "1.27"
  apt_repo:
    description: "Optional target GitHub repository in owner/name form for publishing generated .deb artifacts as an apt repository."
    required: false
    default: ""
  goreleaser_config:
    description: "Optional path to the GoReleaser config file."
    required: false
    default: ".goreleaser.yml"
  scoop_token:
    description: "Optional token for pushing Scoop manifests to an external tap repository."
    required: false
    default: ""
  homebrew_token:
    description: "Optional token for pushing Homebrew formulas to an external tap repository."
    required: false
    default: ""
outputs:
  version:
    description: "Released version without a leading v (e.g. 1.2.3)."
    value: ${{ steps.get_version.outputs.version }}
  tag:
    description: "Git tag that was created or reused (e.g. v1.2.3)."
    value: ${{ steps.get_version.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Validate Linux runner
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [ "${RUNNER_OS}" != "Linux" ]; then
          echo "Error: go-version-release currently supports Linux runners only. Use a Linux runner such as ubuntu-latest." >&2
          exit 1
        fi

    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Determine version
      id: get_version
      shell: bash
      env:
        RAW_VERSION: ${{ inputs.version }}
        RAW_BUMP: ${{ inputs.bump_type }}
      run: |
        VERSION="$(bash "$GITHUB_ACTION_PATH/../scripts/resolve-release-version.sh" "$RAW_VERSION" "$RAW_BUMP" "0.0.0" true)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check version progression
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
        VERSION_FORCE: ${{ inputs.version_force || 'false' }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/check-release-progression.sh" "$NEW_VERSION" "$VERSION_FORCE"

    - name: Create or verify base tag
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/ensure-release-tag.sh" "$TAG"

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go_version || '1.27' }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        args: release --clean --skip=announce --config "${{ inputs.goreleaser_config }}"
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GORELEASER_CURRENT_TAG: ${{ steps.get_version.outputs.tag }}
        SCOOP_TAP_TOKEN: ${{ inputs.scoop_token }}
        HOMEBREW_TAP_TOKEN: ${{ inputs.homebrew_token }}

    - name: Publish Debian packages to apt repository
      if: inputs.apt_repo != ''
      shell: bash
      env:
        APT_REPO_INPUT: ${{ inputs.apt_repo }}
        APT_REPO_TOKEN: ${{ inputs.apt_repo_token }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        APT_SIGNING_KEY: ${{ inputs.apt_signing_key }}
        APT_SIGNING_KEY_PASSPHRASE: ${{ inputs.apt_signing_key_passphrase }}
        TAG: ${{ steps.get_version.outputs.tag }}
      run: "$GITHUB_ACTION_PATH/../scripts/publish-apt-repository.sh"

    - name: Update floating major, minor and latest tags
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/update-floating-release-tags.sh" "$TAG"
