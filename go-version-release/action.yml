name: "Go Version and Release"
description: >
  Determines a Go project release version, validates semver progression, creates
  and pushes a git tag, then runs GoReleaser and can publish generated .deb artifacts to apt.
author: "MiguelRodo"

branding:
  icon: "tag"
  color: "blue"

inputs:
  github_token:
    description: "GitHub token for pushing tags and publishing releases."
    required: true
  apt_repo_token:
    description: "Token with write access to apt_repo; defaults to github_token."
    required: false
    default: ""
  apt_signing_key:
    description: "ASCII-armoured GPG private key for signing APT metadata; leave blank for unsigned metadata."
    required: false
    default: ""
  apt_signing_key_passphrase:
    description: "Passphrase for apt_signing_key; leave blank for an unencrypted key."
    required: false
    default: ""
  version:
    description: "Exact release version in X.Y.Z form (e.g. 1.2.3). Leave blank to use bump_type."
    required: false
    default: ""
  bump_type:
    description: "Version component to bump: patch, minor, or major. Leave blank when version is set."
    required: false
    default: ""
  version_force:
    description: "Set true to allow non-sequential versions (e.g. downgrades or skipped increments)."
    required: false
    default: "false"
  go_version:
    description: "Go version to install (e.g. 1.27)."
    required: false
    default: "1.27"
  apt_repo:
    description: "APT target repository as owner/name; leave blank to skip APT publishing."
    required: false
    default: ""
  goreleaser_config:
    description: "Path to the GoReleaser config file (e.g. .goreleaser.yml)."
    required: false
    default: ".goreleaser.yml"
  scoop_token:
    description: "Token for publishing Scoop manifests to an external repository."
    required: false
    default: ""
  homebrew_token:
    description: "Token for publishing Homebrew formulae to an external repository."
    required: false
    default: ""
outputs:
  version:
    description: "Released version without a leading v (e.g. 1.2.3)."
    value: ${{ steps.get_version.outputs.version }}
  tag:
    description: "Git tag that was created or reused (e.g. v1.2.3)."
    value: ${{ steps.get_version.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Validate Linux runner
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [ "${RUNNER_OS}" != "Linux" ]; then
          echo "Error: go-version-release currently supports Linux runners only. Use a Linux runner such as ubuntu-latest." >&2
          exit 1
        fi

    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Determine version
      id: get_version
      shell: bash
      env:
        RAW_VERSION: ${{ inputs.version }}
        RAW_BUMP: ${{ inputs.bump_type }}
      run: |
        VERSION="$(bash "$GITHUB_ACTION_PATH/../scripts/resolve-release-version.sh" "$RAW_VERSION" "$RAW_BUMP" "0.0.0" true)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check version progression
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
        VERSION_FORCE: ${{ inputs.version_force || 'false' }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/check-release-progression.sh" "$NEW_VERSION" "$VERSION_FORCE"

    - name: Create or verify base tag
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/ensure-release-tag.sh" "$TAG"

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go_version || '1.27' }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        args: release --clean --skip=announce --config "${{ inputs.goreleaser_config }}"
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GORELEASER_CURRENT_TAG: ${{ steps.get_version.outputs.tag }}
        SCOOP_TAP_TOKEN: ${{ inputs.scoop_token }}
        HOMEBREW_TAP_TOKEN: ${{ inputs.homebrew_token }}

    - name: Publish Debian packages to apt repository
      if: inputs.apt_repo != ''
      shell: bash
      env:
        APT_REPO_INPUT: ${{ inputs.apt_repo }}
        APT_REPO_TOKEN: ${{ inputs.apt_repo_token }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        APT_SIGNING_KEY: ${{ inputs.apt_signing_key }}
        APT_SIGNING_KEY_PASSPHRASE: ${{ inputs.apt_signing_key_passphrase }}
        TAG: ${{ steps.get_version.outputs.tag }}
      run: "$GITHUB_ACTION_PATH/../scripts/publish-apt-repository.sh"

    - name: Update floating major, minor and latest tags
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/update-floating-release-tags.sh" "$TAG"
