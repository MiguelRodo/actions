name: "Version and Release"
description: >
  Bumps versions for Python (pyproject.toml) and R (DESCRIPTION) packages when
  present, creates a versioned git tag, updates floating major/minor tags, and
  publishes a GitHub Release.
author: "MiguelRodo"

branding:
  icon: "tag"
  color: "purple"

inputs:
  github_token:
    description: "GitHub token for pushing tags and creating releases."
    required: true
  version:
    description: >
      Exact version to apply to all packages (e.g. 1.2.3).
      Overridden per-package by python_version or r_version.
      Cannot be set together with bump_type.
    required: false
    default: ""
  bump_type:
    description: >
      Version component to bump (major | minor | patch).
      The new version is derived by bumping the most recent semver git tag.
      Cannot be set together with version.
    required: false
    default: ""
  python_version:
    description: "Override: exact version to set for the Python package (e.g. 1.2.3)."
    required: false
    default: ""
  r_version:
    description: "Override: exact version to set for the R package (e.g. 1.2.3)."
    required: false
    default: ""
  version_force:
    description: >
      When true (the default is false), skip strict version progression
      checks (e.g., allowing downgrades or large version jumps).
    required: false
    default: "false"

outputs:
  version:
    description: "Released version without a leading v (e.g. 1.2.3)."
    value: ${{ steps.get_version.outputs.version }}
  tag:
    description: "Git tag that was created (e.g. v1.2.3)."
    value: ${{ steps.get_version.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Determine version
      id: get_version
      shell: bash
      env:
        RAW_VERSION: ${{ inputs.version }}
        RAW_BUMP: ${{ inputs.bump_type }}
      run: |
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -z "$RAW_VERSION" ] && [ -z "$RAW_BUMP" ]; then
          echo "Error: provide one of 'version' or 'bump_type'. Valid bump_type values: major, minor, patch." >&2
          exit 1
        fi
        if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
          echo "Error: this action only runs on tag pushes or workflow_dispatch with version/bump_type." >&2
          exit 1
        fi
        VERSION="$(bash "$GITHUB_ACTION_PATH/../scripts/resolve-release-version.sh" "$RAW_VERSION" "$RAW_BUMP" "0.0.0" true)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
        echo "Resolved version: $VERSION"

    - name: Check version progression
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
        VERSION_FORCE: ${{ inputs.version_force || 'false' }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/check-release-progression.sh" "$NEW_VERSION" "$VERSION_FORCE"

    - name: Determine bump type
      id: determine_bump_type
      shell: bash
      env:
        RAW_BUMP: ${{ inputs.bump_type }}
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        BUMP_TYPE_INPUT=$("$GITHUB_ACTION_PATH/../scripts/normalize-action-input.sh" "$RAW_BUMP")
        if [ -n "${BUMP_TYPE_INPUT}" ]; then
          BUMP_TYPE="${BUMP_TYPE_INPUT}"
        else
          NEW_TAG="v${NEW_VERSION}"

          PREV_TAG=$(git tag --sort=version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$NEW_TAG" \
            | tail -1)

          if [ -z "$PREV_TAG" ]; then
            BUMP_TYPE="patch"
          else
            PREV_VERSION="${PREV_TAG#v}"
            BUMP_TYPE=$("$GITHUB_ACTION_PATH/../scripts/determine-bump-type.sh" "$NEW_VERSION" "$PREV_VERSION")
          fi
        fi

        echo "bump_type=${BUMP_TYPE}" >> "$GITHUB_OUTPUT"
        echo "Bump type: ${BUMP_TYPE}"

    - name: Update package versions
      shell: bash
      env:
        GLOBAL_VERSION_INPUT: ${{ inputs.version }}
        PY_INPUT_RAW: ${{ inputs.python_version }}
        R_INPUT_RAW: ${{ inputs.r_version }}
        BUMP_TYPE_INPUT: ${{ steps.determine_bump_type.outputs.bump_type }}
      run: |
        bash "$GITHUB_ACTION_PATH/../scripts/update-package-versions.sh" \
          "$GLOBAL_VERSION_INPUT" \
          "$PY_INPUT_RAW" \
          "$R_INPUT_RAW" \
          "$BUMP_TYPE_INPUT"

    - name: Commit version changes
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        if git diff --quiet; then
          echo "No version file changes to commit."
        else
          FILES_TO_ADD=()
          [ -f pyproject.toml ] && FILES_TO_ADD+=(pyproject.toml)
          [ -f DESCRIPTION ] && FILES_TO_ADD+=(DESCRIPTION)
          if [ ${#FILES_TO_ADD[@]} -gt 0 ]; then
            git add "${FILES_TO_ADD[@]}"
          fi
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push
        fi

    - name: Create or verify base tag
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/ensure-release-tag.sh" "$TAG"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        generate_release_notes: true
        make_latest: true
        token: ${{ inputs.github_token }}

    - name: Update floating major, minor and latest tags
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/update-floating-release-tags.sh" "$TAG"
