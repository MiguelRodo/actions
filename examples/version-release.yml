# .github/workflows/version-release.yml
#
# Bumps the package version, creates a versioned git tag with floating
# major/minor aliases, and publishes a GitHub Release.
#
# Supports Python (pyproject.toml) and R (DESCRIPTION) packages.
# Files not present in the repository root are silently skipped.
#
# Trigger options:
#   - Push a semver tag (e.g. `git tag v1.2.3 && git push origin v1.2.3`).
#   - Run manually via the Actions UI and enter an exact version or choose a bump component.
#
# Copy this file into your repository's .github/workflows/ directory.

name: Version and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release version in X.Y.Z form (e.g. 1.2.3). Leave blank to bump a component.'
        required: false
        type: string
      bump_type:
        description: 'Component to bump. Choose none when entering an exact version.'
        required: false
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major
      version_force:
        description: 'Allow a non-sequential version, such as a downgrade or skipped increment.'
        required: false
        type: boolean
        default: false
      python_version:
        description: 'Optional exact Python version in X.Y.Z form; overrides the release version.'
        required: false
        type: string
      r_version:
        description: 'Optional exact R version in X.Y.Z form; overrides the release version.'
        required: false
        type: string

jobs:
  version-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tags, version commits, and create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required to read all tags for bump mode

      - name: Version and Release
        id: release
        uses: MiguelRodo/actions/version-release@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          bump_type: ${{ inputs.bump_type != 'none' && inputs.bump_type || '' }}
          version_force: ${{ inputs.version_force }}
          python_version: ${{ inputs.python_version }}
          r_version: ${{ inputs.r_version }}

      - name: Show outputs
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "Version: ${VERSION}"
          echo "Tag:     ${TAG}"
