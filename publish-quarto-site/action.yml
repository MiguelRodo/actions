name: "Publish Quarto Site"
description: "Publishes a Quarto site to the gh-pages branch, creating the branch if it does not already exist."
author: "MiguelRodo"

branding:
  icon: "book-open"
  color: "orange"

inputs:
  github_token:
    description: "GitHub token used to push to the gh-pages branch."
    required: true
  path:
    description: "Path to the Quarto project to publish."
    required: false
    default: "."
  setup_r:
    description: "Whether to install R and set up R dependencies before rendering."
    required: false
    default: "false"
  renv_restore:
    description: "Deprecated compatibility input. Ignored; setup-r-dependencies restores renv.lock automatically when setup_r is true."
    required: false
    default: "true"
  setup_python:
    description: "Whether to install Python and set up Python dependencies before rendering."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Bootstrap gh-pages when missing
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
      run: |
        if ! git -C "$PROJECT_PATH" ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
          tree=$(git -C "$PROJECT_PATH" mktree </dev/null)
          commit=$(git -C "$PROJECT_PATH" -c user.name="Quarto GHA Workflow Runner" -c user.email="quarto-github-actions-publish@example.com" commit-tree "$tree" -m "Initializing gh-pages branch")
          git -C "$PROJECT_PATH" push origin "$commit:refs/heads/gh-pages"
        fi

    - name: Set up R
      if: ${{ inputs.setup_r == 'true' }}
      uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      with:
        use-public-rspm: true

    - name: Install R dependencies
      if: ${{ inputs.setup_r == 'true' }}
      uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      with:
        working-directory: ${{ inputs.path }}
        needs: website

    - name: Set up Python
      if: ${{ inputs.setup_python == 'true' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"
        cache: "pip"
        cache-dependency-path: |
          **/requirements*.txt
          **/pyproject.toml

    - name: Install Python dependencies
      if: ${{ inputs.setup_python == 'true' }}
      shell: bash
      env:
        PROJ_PATH: ${{ inputs.path }}
      run: |
        if [ -f "${PROJ_PATH}/requirements.txt" ]; then
          pip install -r "${PROJ_PATH}/requirements.txt"
        elif [ -f "${PROJ_PATH}/pyproject.toml" ]; then
          pip install "${PROJ_PATH}"
        fi

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

    - name: Publish Quarto site to gh-pages
      uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
      with:
        target: gh-pages
        path: ${{ inputs.path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
