name: "Rust Version and Release"
description: >
  Determines a Rust project release version, validates semver progression, creates
  and pushes a git tag, then builds .deb with cargo-deb and can publish generated .deb artifacts to apt.
author: "MiguelRodo"

branding:
  icon: "tag"
  color: "blue"

inputs:
  github_token:
    description: "GitHub token for pushing tags and publishing releases."
    required: true
  apt_repo_token:
    description: "Optional GitHub token used only for cloning/fetching/pushing apt_repo. Falls back to github_token when omitted."
    required: false
    default: ""
  apt_signing_key:
    description: "Optional ASCII-armored GPG private key for signing apt repository metadata. When set, the action imports the key and generates signed InRelease and Release.gpg files alongside the unsigned Release file."
    required: false
    default: ""
  apt_signing_key_passphrase:
    description: "Optional passphrase for the apt_signing_key. When set, it is written to a secure temporary file and passed to GPG via --passphrase-file so passphrase-protected private keys can be used for signing."
    required: false
    default: ""
  version:
    description: "Exact version to apply (e.g. 1.2.3). Cannot be used with bump_type."
    required: false
    default: ""
  bump_type:
    description: "Version component to bump (major | minor | patch). Cannot be used with version."
    required: false
    default: ""
  version_force:
    description: >
      When true (the default is false), skip strict version progression
      checks (e.g., allowing downgrades or large version jumps).
    required: false
    default: "false"
  rust_version:
    description: "Rust version to install with actions/setup-rust."
    required: false
    default: "stable"
  apt_repo:
    description: "Optional target GitHub repository in owner/name form for publishing generated .deb artifacts as an apt repository."
    required: false
    default: ""
outputs:
  version:
    description: "Released version without a leading v (e.g. 1.2.3)."
    value: ${{ steps.get_version.outputs.version }}
  tag:
    description: "Git tag that was created or reused (e.g. v1.2.3)."
    value: ${{ steps.get_version.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Validate Linux runner
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [ "${RUNNER_OS}" != "Linux" ]; then
          echo "Error: rust-version-release currently supports Linux runners only. Use a Linux runner such as ubuntu-latest." >&2
          exit 1
        fi

    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Determine version
      id: get_version
      shell: bash
      env:
        RAW_VERSION: ${{ inputs.version }}
        RAW_BUMP: ${{ inputs.bump_type }}
      run: |
        # Massage version (trim whitespace, lowercase)
        VERSION_INPUT=$(echo "$RAW_VERSION" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
        if [ "$RAW_VERSION" != "$VERSION_INPUT" ] && [ -n "$RAW_VERSION" ]; then
          echo "Note: Massaged version input from '$RAW_VERSION' to '$VERSION_INPUT'"
        fi

        # Massage bump_type (trim whitespace, lowercase)
        BUMP_INPUT=$(echo "$RAW_BUMP" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
        if [ "$RAW_BUMP" != "$BUMP_INPUT" ] && [ -n "$RAW_BUMP" ]; then
          echo "Note: Massaged bump_type input from '$RAW_BUMP' to '$BUMP_INPUT'"
        fi

        if [ -n "$VERSION_INPUT" ] && [ -n "$BUMP_INPUT" ]; then
          echo "Error: cannot set both 'version' and 'bump_type'." >&2
          exit 1
        fi

        if [ -n "$BUMP_INPUT" ]; then
          PREV_TAG=$(git tag --sort=version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -1 || true)
          CURRENT="${PREV_TAG#v}"
          if [ -z "$CURRENT" ]; then
            CURRENT="0.0.0"
          fi
          VERSION=$("$GITHUB_ACTION_PATH/../scripts/apply-version-bump.sh" "$BUMP_INPUT" "$CURRENT")
        elif [ -n "$VERSION_INPUT" ]; then
          VERSION="${VERSION_INPUT#v}"
        elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
        else
          echo "Error: provide one of 'version' or 'bump_type', or run from a tag ref." >&2
          exit 1
        fi

        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: version '$VERSION' is not valid semver (X.Y.Z)." >&2
          exit 1
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check version progression
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
        VERSION_FORCE: ${{ inputs.version_force || 'false' }}
      run: |
        VERSION_FORCE_INPUT=$(echo "$VERSION_FORCE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
        if [ "$VERSION_FORCE_INPUT" != "true" ] && [ "$VERSION_FORCE_INPUT" != "false" ]; then
          echo "Error: version_force must be 'true' or 'false', got: '${VERSION_FORCE}'" >&2
          exit 1
        fi

        if [ "$VERSION_FORCE_INPUT" = "true" ]; then
          echo "version_force is true; skipping version progression check."
          exit 0
        fi

        PREV_TAG=$(git tag --sort=version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "v${NEW_VERSION}" | tail -1 || true)

        if [ -z "$PREV_TAG" ]; then
          echo "No previous semver tag found; skipping version progression check."
          exit 0
        fi

        PREV_VERSION="${PREV_TAG#v}"
        "$GITHUB_ACTION_PATH/../scripts/check-version-progression.sh" "$NEW_VERSION" "$PREV_VERSION"

    - name: Update Cargo.toml version
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        if [ -f "Cargo.toml" ]; then
          sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" Cargo.toml
          git add Cargo.toml
          git commit -m "chore: bump version to ${NEW_VERSION}" || true
          git push || true
        fi

    - name: Create and push git tag
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: |
        HEAD_SHA="$(git rev-parse HEAD)"

        if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA="$(git rev-list -n 1 "${TAG}")"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "Error: tag ${TAG} already exists on origin but points to ${TAG_SHA}, not HEAD ${HEAD_SHA}." >&2
            exit 1
          fi
          echo "Tag ${TAG} already exists on origin and points to HEAD."
          exit 0
        fi

        if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
          TAG_SHA="$(git rev-list -n 1 "${TAG}")"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "Error: local tag ${TAG} points to ${TAG_SHA}, not HEAD ${HEAD_SHA}." >&2
            exit 1
          fi
          echo "Tag ${TAG} already exists locally and points to HEAD."
        else
          git tag -a "$TAG" -m "Release $TAG"
        fi

        git push origin "refs/tags/${TAG}"

    - name: Update floating major, minor and latest tags
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: |
        MAJOR=$(echo "$TAG" | cut -d'.' -f1)
        MINOR=$(echo "$TAG" | cut -d'.' -f1,2)

        echo "Updating floating tags to $TAG..."
        git tag -fa "$MINOR" -m "Update $MINOR to point to $TAG"
        git tag -fa "$MAJOR" -m "Update $MAJOR to point to $TAG"
        git tag -fa "latest" -m "Update latest to point to $TAG"
        git push origin "refs/tags/$MINOR" --force
        git push origin "refs/tags/$MAJOR" --force
        git push origin "refs/tags/latest" --force

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust_version || 'stable' }}

    - name: Build Debian packages
      shell: bash
      run: |
        cargo install cargo-deb
        cargo deb --output dist/

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Publish Debian packages to apt repository
      if: inputs.apt_repo != ''
      shell: bash
      env:
        APT_REPO_INPUT: ${{ inputs.apt_repo }}
        APT_REPO_TOKEN: ${{ inputs.apt_repo_token }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github_token }}
        APT_SIGNING_KEY: ${{ inputs.apt_signing_key }}
        APT_SIGNING_KEY_PASSPHRASE: ${{ inputs.apt_signing_key_passphrase }}
        TAG: ${{ steps.get_version.outputs.tag }}
      run: "$GITHUB_ACTION_PATH/../scripts/publish-apt-repository.sh"
