name: "R Version and Release"
description: "Bumps the version in DESCRIPTION, builds the R package, pushes floating tags, and publishes a GitHub Release with the tarball."
author: "MiguelRodo"

branding:
  icon: "tag"
  color: "blue"

inputs:
  github_token:
    description: "GitHub token for pushing tags and publishing releases."
    required: true
  version:
    description: >
      Exact version to set (e.g. v1.2.3).
      Cannot be set together with bump_type.
      Whitespace is ignored and case is insensitive.
    required: false
    default: ""
  bump_type:
    description: >
      Version component to bump (major | minor | patch).
      Cannot be set together with version.
      Whitespace is ignored and case is insensitive.
    required: false
    default: ""
  version_force:
    description: >
      When true (the default is false), skip strict version progression
      checks (e.g., allowing downgrades or large version jumps).

    required: false
    default: "false"

outputs:
  version:
    description: "Released version without a leading v (e.g. 1.2.3)."
    value: ${{ steps.get_version.outputs.version }}
  tag:
    description: "Git tag that was created (e.g. v1.2.3)."
    value: ${{ steps.get_version.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Parse and validate inputs
      id: get_version
      shell: bash
      env:
        RAW_VERSION: ${{ inputs.version }}
        RAW_BUMP: ${{ inputs.bump_type }}
      run: |
        if [ ! -f DESCRIPTION ]; then
          echo "Error: No DESCRIPTION file found in the root directory. This action must be run in an R package repository." >&2
          exit 1
        fi
        CURRENT="$(grep -E '^Version:' DESCRIPTION | awk '{print $2}' | tr -d '[:space:]' || true)"
        VERSION="$(bash "$GITHUB_ACTION_PATH/../scripts/resolve-release-version.sh" "$RAW_VERSION" "$RAW_BUMP" "$CURRENT" false)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
        echo "Resolved version: $VERSION"

    - name: Check version progression
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
        VERSION_FORCE: ${{ inputs.version_force || 'false' }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/check-release-progression.sh" "$NEW_VERSION" "$VERSION_FORCE"

    - name: Update R version
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        bash "$GITHUB_ACTION_PATH/../scripts/update-r-description-version.sh" "$NEW_VERSION" DESCRIPTION
        echo "R version updated to ${NEW_VERSION}"

    - name: Commit version changes
      shell: bash
      env:
        NEW_VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        if git diff --quiet DESCRIPTION; then
          echo "No version file changes to commit."
        else
          git add DESCRIPTION
          git commit -m "chore: bump R package version to ${NEW_VERSION}"
          git push
        fi

    - name: Set up R
      uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      with:
        use-public-rspm: true

    - name: Setup R Dependencies
      uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      with:
        extra-packages: any::rcmdcheck

    - name: Build R Package
      shell: bash
      run: |
        R CMD build .
        TARBALL=$(ls *.tar.gz | head -n 1)
        echo "tarball=$TARBALL" >> "$GITHUB_ENV"

    - name: Create or verify base tag
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/ensure-release-tag.sh" "$TAG"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        generate_release_notes: true
        make_latest: true
        files: ${{ env.tarball }}
        token: ${{ inputs.github_token }}

    - name: Update floating major, minor and latest tags
      shell: bash
      env:
        TAG: ${{ steps.get_version.outputs.tag }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/update-floating-release-tags.sh" "$TAG"
