name: Fix v3 documentation fallback

on:
  push:
    branches:
      - fix/191-v3-generator-fallback

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Correct dormant v2 fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/generate-action-docs.py")
          text = path.read_text(encoding="utf-8")
          old = "uses: MiguelRodo/actions/<action-folder-name>@v2"
          new = "uses: MiguelRodo/actions/<action-folder-name>@v3"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale fallback, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          python3 scripts/generate-action-docs.py --check
          git diff --check
          if grep -Fq 'uses: MiguelRodo/actions/<action-folder-name>@v2' scripts/generate-action-docs.py; then
            echo 'stale v2 fallback remains' >&2
            exit 1
          fi

      - name: Commit focused fix and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-action-docs.py
          git rm .github/workflows/fix-191-v3-generator-fallback.yml
          git diff --cached --check
          git commit -m 'Fix v3 documentation generator fallback'
          git push origin HEAD:fix/191-v3-generator-fallback
