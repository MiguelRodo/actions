name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    name: Lint workflow and action files (actionlint + shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install pinned actionlint
        run: |
          ./scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint

      - name: Run actionlint (includes shellcheck for inline scripts)
        # actionlint automatically delegates shell script linting to shellcheck
        # when it is available on PATH, covering both workflow files and
        # composite action.yml inline `run:` blocks.
        run: actionlint

      - name: Run shellcheck on standalone shell scripts
        # The github-projects directory is a canonical vendored skill bundle;
        # lint its source upstream rather than modifying the installed copy here.
        run: >-
          find . -name '*.sh'
          -not -path './.git/*'
          -not -path './.agents/skills/github-projects/*'
          -print0 | xargs -0 -r shellcheck

  docs:
    name: Generated action documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated action references are current
        run: python3 scripts/generate-action-docs.py --check

  bats:
    name: BATS unit tests (shell scripts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install BATS
        run: |
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: bats scripts/tests/

  publish-quarto-site-integration:
    name: Publish Quarto site from fresh repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create fresh Quarto repository
        shell: bash
        run: |
          remote="$RUNNER_TEMP/publish-quarto-site-remote.git"
          site="$RUNNER_TEMP/publish-quarto-site-site"
          git init --bare "$remote"
          git init "$site"
          git -C "$site" config user.name "Test User"
          git -C "$site" config user.email "test@example.com"
          printf 'project:\n  type: website\n' > "$site/_quarto.yml"
          printf '# Fresh site\n' > "$site/index.qmd"
          git -C "$site" add .
          git -C "$site" commit -m "Initial site"
          git -C "$site" branch -M main
          git -C "$site" remote add origin "$remote"
          git -C "$site" push -u origin main

      - name: Publish from fresh repository
        uses: ./publish-quarto-site
        with:
          github_token: ${{ github.token }}
          path: ${{ runner.temp }}/publish-quarto-site-site

      - name: Verify gh-pages was created
        shell: bash
        run: |
          remote="$RUNNER_TEMP/publish-quarto-site-remote.git"
          git --git-dir="$remote" rev-parse --verify refs/heads/gh-pages
          git --git-dir="$remote" cat-file -e refs/heads/gh-pages:index.html
