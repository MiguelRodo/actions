name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    name: Lint workflow and action files (actionlint + shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install pinned actionlint
        run: |
          ./scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint

      - name: Run actionlint (includes shellcheck for inline scripts)
        # actionlint automatically delegates shell script linting to shellcheck
        # when it is available on PATH, covering both workflow files and
        # composite action.yml inline `run:` blocks.
        run: actionlint

      - name: Run shellcheck on standalone shell scripts
        # The github-projects directory is a canonical vendored skill bundle;
        # lint its source upstream rather than modifying the installed copy here.
        run: >-
          find . -name '*.sh'
          -not -path './.git/*'
          -not -path './.agents/skills/github-projects/*'
          -print0 | xargs -0 -r shellcheck

  docs:
    name: Generated action documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated action references are current
        run: python3 scripts/generate-action-docs.py --check

  bats:
    name: BATS unit tests (shell scripts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install BATS
        run: |
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: bats scripts/tests/
