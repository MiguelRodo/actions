name: Bootstrap generated action docs

on:
  push:
    branches:
      - issue-119-generated-action-docs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate documentation
        run: python3 scripts/generate-action-docs.py --write

      - name: Remove one-use bootstrap workflow
        run: rm .github/workflows/bootstrap-issue-119-docs.yml

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate action documentation"
          git push
