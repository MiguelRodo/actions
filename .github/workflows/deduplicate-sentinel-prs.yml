name: Deduplicate Sentinel remediation PRs

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report duplicates without closing them
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  deduplicate-current-pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.body || '', 'sentinel-fingerprint:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Reuse the canonical remediation PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/sentinel-fingerprint.sh deduplicate "$GITHUB_REPOSITORY" "$PR_NUMBER"

  sweep-open-prs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Identify or close duplicate Sentinel PRs
        env:
          GH_TOKEN: ${{ github.token }}
          SENTINEL_DEDUP_DRY_RUN: ${{ inputs.dry_run }}
        run: scripts/sentinel-fingerprint.sh sweep "$GITHUB_REPOSITORY"
